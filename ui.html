<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinBot – Financial Q&A Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a56db, #0e9f6e);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 20px rgba(26,86,219,0.4);
    }
    header .logo { font-size: 32px; }
    header h1 { font-size: 24px; font-weight: 700; }
    header p  { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    .badge {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ── Main layout ── */
    .container {
      display: flex;
      flex: 1;
      max-width: 1100px;
      margin: 30px auto;
      gap: 24px;
      padding: 0 20px;
      width: 100%;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #1e2130;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2d3148;
    }

    .card h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7c8db5;
      margin-bottom: 14px;
    }

    .sample-btn {
      display: block;
      width: 100%;
      background: #252840;
      border: 1px solid #2d3148;
      color: #cbd5e1;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
      line-height: 1.4;
    }
    .sample-btn:hover {
      background: #1a56db22;
      border-color: #1a56db;
      color: #fff;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2d3148;
      font-size: 13px;
    }
    .metric:last-child { border-bottom: none; }
    .metric-label { color: #7c8db5; }
    .metric-value { color: #0e9f6e; font-weight: 600; font-size: 12px; }

    /* ── Chat area ── */
    .chat-area { flex: 1; display: flex; flex-direction: column; gap: 16px; }

    .messages {
      flex: 1;
      background: #1e2130;
      border-radius: 12px;
      border: 1px solid #2d3148;
      padding: 24px;
      min-height: 420px;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      text-align: center;
      margin: auto;
      opacity: 0.5;
    }
    .welcome .icon { font-size: 48px; margin-bottom: 12px; }
    .welcome p { font-size: 14px; }

    .msg {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: #1a56db; }
    .msg.bot  .avatar { background: #0e9f6e; }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.user .bubble {
      background: #1a56db;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: #252840;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .meta {
      font-size: 11px;
      color: #4a5568;
      margin-top: 6px;
      display: flex;
      gap: 10px;
    }
    .meta span { display: flex; align-items: center; gap: 3px; }

    /* ── Input ── */
    .input-area {
      background: #1e2130;
      border-radius: 12px;
      border: 1px solid #2d3148;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: #252840;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 12px;
      font-size: 14px;
      resize: none;
      height: 48px;
      max-height: 120px;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
    }
    textarea:focus { border-color: #1a56db; }

    .send-btn {
      background: linear-gradient(135deg, #1a56db, #0e9f6e);
      border: none;
      border-radius: 8px;
      color: white;
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      height: 48px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .send-btn:hover { opacity: 0.9; transform: scale(1.03); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Typing indicator ── */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #0e9f6e;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }

    /* scrollbar */
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: #1e2130; }
    .messages::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <div>
    <h1>FinBot</h1>
    <p>RAG-Powered Financial Document Assistant</p>
  </div>
  <div class="badge">⚡ Llama 3.3 70B · FAISS · Groq</div>
</header>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="card">
      <h3>Sample Questions</h3>
      <button class="sample-btn" onclick="fillQuery(this)">What is the minimum credit score for a personal loan?</button>
      <button class="sample-btn" onclick="fillQuery(this)">What is the maximum tenure for a home loan?</button>
      <button class="sample-btn" onclick="fillQuery(this)">What is the waiting period for pre-existing diseases?</button>
      <button class="sample-btn" onclick="fillQuery(this)">What are the eligibility criteria for self-employed applicants?</button>
      <button class="sample-btn" onclick="fillQuery(this)">How long does it take to resolve a grievance?</button>
    </div>

    <div class="card">
      <h3>System Info</h3>
      <div class="metric">
        <span class="metric-label">LLM</span>
        <span class="metric-value">Llama 3.3 70B</span>
      </div>
      <div class="metric">
        <span class="metric-label">Embeddings</span>
        <span class="metric-value">Gemini-001</span>
      </div>
      <div class="metric">
        <span class="metric-label">Vector DB</span>
        <span class="metric-value">FAISS</span>
      </div>
      <div class="metric">
        <span class="metric-label">Chunks</span>
        <span class="metric-value" id="chunk-count">—</span>
      </div>
      <div class="metric">
        <span class="metric-label">Status</span>
        <span class="metric-value" id="status-badge">checking...</span>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome">
        <div class="icon">💬</div>
        <p>Ask anything about the financial document</p>
      </div>
    </div>

    <div class="input-area">
      <textarea id="query" placeholder="Ask a question about loans, insurance, eligibility..." onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendQuery()">➤</button>
    </div>
  </div>

</div>

<script>
  const API = "http://localhost:8001";

  // Check health on load
  fetch(`${API}/health`)
    .then(r => r.json())
    .then(d => {
      document.getElementById("status-badge").textContent = "🟢 Online";
      document.getElementById("chunk-count").textContent = d.chunks_loaded;
    })
    .catch(() => {
      document.getElementById("status-badge").textContent = "🔴 Offline";
    });

  function fillQuery(btn) {
    document.getElementById("query").value = btn.textContent.trim();
    document.getElementById("query").focus();
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  }

  function addMessage(role, text, meta = null) {
    const box = document.getElementById("messages");
    const welcome = box.querySelector(".welcome");
    if (welcome) welcome.remove();

    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === "user" ? "👤" : "🤖"}</div>
      <div>
        <div class="bubble">${text}</div>
        ${meta ? `<div class="meta">
          <span>⏱ ${meta.latency}s</span>
          <span>📄 ${meta.chunks} chunks</span>
        </div>` : ""}
      </div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  function addTyping() {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.id = "typing";
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function sendQuery() {
    const input = document.getElementById("query");
    const btn = document.getElementById("send-btn");
    const query = input.value.trim();
    if (!query) return;

    addMessage("user", query);
    input.value = "";
    btn.disabled = true;
    addTyping();

    try {
      const res = await fetch(`${API}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      document.getElementById("typing")?.remove();
      addMessage("bot", data.answer, {
        latency: data.latency_seconds,
        chunks: data.chunks_retrieved
      });
    } catch (err) {
      document.getElementById("typing")?.remove();
      addMessage("bot", "⚠️ Could not reach the API. Make sure the server is running.");
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
